[workspace]
resolver = "2"
members = ["crates/jmk-core", "crates/jmk-proto", "crates/jmk-device", "crates/jmk-sim", "crates/jmk-wasm", "tools/uf2", "tools/cli"]
# Firmware crates build for bare-metal targets and keep their own lockfiles.
# The registry server has its own dependency tree and lockfile too.
exclude = ["firmware", "server"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JanLunge/jmk"

[workspace.dependencies]
heapless = { version = "0.9", features = ["serde"] }
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = { version = "1.1", default-features = false }
