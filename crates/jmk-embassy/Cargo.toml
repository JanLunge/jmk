[package]
name = "jmk-embassy"
version = "0.1.0"
description = "What every Embassy-based JMK port shares: USB interfaces, queues, the main loop and the split cable pump"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/JanLunge/jmk"

[dependencies]
jmk-core = { path = "../jmk-core" }
jmk-proto = { path = "../jmk-proto" }
jmk-device = { path = "../jmk-device" }
# Each HID interface takes a handler, and `usb.rs` adds one for the bus
# state: four interfaces need five. Past the default of four, building the
# USB device panics at start-up and the keyboard never shows up.
embassy-usb = { version = "0.6", features = ["max-handler-count-8", "max-interface-count-8"] }
embassy-sync = "0.8"
embassy-futures = "0.1"
embassy-time = "0.5"
embedded-storage = "0.3"
embedded-io-async = "0.7"
static_cell = "2"
