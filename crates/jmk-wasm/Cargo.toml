[package]
name = "jmk-wasm"
version = "0.1.0"
description = "WebAssembly bridge for the configurator: protocol codec and virtual keyboards"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jmk-core = { path = "../jmk-core" }
jmk-proto = { path = "../jmk-proto" }
jmk-sim = { path = "../jmk-sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
