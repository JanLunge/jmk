[package]
name = "jmk-rp2040"
version = "0.1.0"
description = "JMK keyboard firmware for RP2040 boards"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
jmk-core = { path = "../../crates/jmk-core" }
jmk-proto = { path = "../../crates/jmk-proto" }
jmk-device = { path = "../../crates/jmk-device" }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-time = "0.5"
embassy-sync = "0.8"
embassy-futures = "0.1"
embassy-usb = "0.6"
cortex-m-rt = "0.7"
panic-halt = "1"
static_cell = "2"
cortex-m = "0.7"
portable-atomic = { version = "1", features = ["critical-section"] }
embedded-storage = "0.3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
