[package]
name = "jmk-rp2040"
version = "0.1.0"
description = "JMK keyboard firmware for RP2040 boards"
edition = "2021"
license = "Apache-2.0"

[dependencies]
jmk-proto = { path = "../../crates/jmk-proto" }
jmk-device = { path = "../../crates/jmk-device" }
jmk-embassy = { path = "../../crates/jmk-embassy" }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10", features = ["rp2040", "time-driver", "critical-section-impl", "unstable-pac"] }
embassy-time = "0.5"
embassy-futures = "0.1"
embassy-sync = "0.8"
fixed = "1"
critical-section = "1"
cortex-m-rt = "0.7"
panic-halt = "1"
static_cell = "2"
cortex-m = "0.7"
portable-atomic = { version = "1", features = ["critical-section"] }
embedded-storage = "0.3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2

[lints.rust]
# The code is shared with firmware/rp2350, which has these features.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("rp235x", "rp235xa", "rp235xb"))'] }
